<style>
/* Layout: a timeline. Each sitting is a thread, each sentence a post down the
   thread line. Dark only, by request. */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#000; --raised:#16181c; --line:#2f3336; --hover:#080808;
  --fg:#e7e9ea; --dim:#71767b; --accent:#1d9bf0; --accent-ink:#fff;
  --gloss:#8ecdf7; --saved:#f91880;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Charter,Georgia,serif;
  --sz:1.0625rem;
  color-scheme:dark;
}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);
     -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
     z-index:40;background:rgba(0,0,0,.92)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
       background:rgba(0,0,0,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.wrap{max-width:38rem;margin:0 auto;
      padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:.7rem;padding-block:.6rem}
.ava{width:2.1rem;height:2.1rem;border-radius:50%;flex:none;display:grid;place-items:center;
     background:#3d1f2b;color:#f3c6d5;font-weight:700;font-size:.95rem;font-family:var(--serif)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:.97rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:.8rem;color:var(--dim);font-variant-numeric:tabular-nums}
.aa{font-size:1.05rem;padding:.3rem .5rem;border-radius:999px;color:var(--fg)}
.aa:hover{background:var(--raised)}
nav{display:flex}
nav button{flex:1;padding:.85rem 0 .7rem;color:var(--dim);font-size:.88rem;font-weight:600;position:relative}
nav button[aria-selected="true"]{color:var(--fg)}
nav button[aria-selected="true"]::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
     bottom:0;width:3.4rem;height:4px;border-radius:999px;background:var(--accent)}
.rail{display:none}
.rail i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}

/* ---------- posts ---------- */
main{max-width:38rem;margin:0 auto;padding-bottom:45vh}
.post{display:grid;grid-template-columns:2.6rem 1fr;gap:.75rem;
      padding-left:max(16px,env(safe-area-inset-left,0px));
      padding-right:max(16px,env(safe-area-inset-right,0px));
      padding-block:.75rem;border-bottom:1px solid var(--line);position:relative}
.post.cont{border-bottom:0;padding-top:0;padding-bottom:.1rem}
.post.last{border-bottom:1px solid var(--line);padding-bottom:.75rem}
.gutter{position:relative}
.gutter .ava{width:2.6rem;height:2.6rem;font-size:1.1rem}
.thread{position:absolute;left:1.25rem;top:0;bottom:-.1rem;width:2px;background:var(--line)}
.post.cont .thread{top:-.4rem}
.meta{display:flex;align-items:baseline;gap:.3rem;flex-wrap:wrap;font-size:.95rem;margin-bottom:.15rem}
.meta b{font-weight:700}
.meta .tick{width:1rem;height:1rem;flex:none;align-self:center;fill:var(--accent)}
.meta .at,.meta .dot,.meta .ago{color:var(--dim);font-weight:400;font-size:.9rem}
.body{font-size:var(--sz);line-height:1.45;overflow-wrap:break-word}
.de{margin:0;hyphens:none;-webkit-hyphens:none}
.de .br{display:block}
.gl{list-style:none;margin:.55rem 0 0;padding:0;font-size:.82rem;line-height:1.5;color:var(--dim)}
.gl b{color:var(--gloss);font-weight:600}
.en{font-family:var(--serif);font-style:italic;color:var(--dim);font-size:.95rem;line-height:1.45;
    margin:.6rem 0 0;padding-left:.75rem;border-left:2px solid var(--line)}
.en.open{margin-top:0}
.il{font-size:.8rem;color:#8b919a;margin:.3rem 0 0;line-height:1.5}
.cap{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:1rem 0 .3rem}
.de.echo{margin:0;color:var(--fg)}
.warmhead{padding-block:1.6rem .4rem;border-bottom:0}
.eyebrow.warm{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#4bbf8a}
.de.warm{color:#eef1f4}
.w{cursor:pointer;-webkit-tap-highlight-color:rgba(29,155,240,.25)}
.w:active{background:rgba(29,155,240,.22);border-radius:3px}
.pop{position:absolute;z-index:50;max-width:min(20rem,calc(100vw - 2rem));
     background:var(--raised);border:1px solid var(--line);border-radius:.7rem;
     padding:.6rem .75rem;box-shadow:0 6px 24px rgba(0,0,0,.7);
     display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.pop b{font-size:.95rem}
.pop span{color:var(--dim);font-size:.88rem;min-width:0}
.pop .none{font-style:italic}
.pop .say{color:var(--dim);display:inline-flex;margin-left:auto}
.pop .say svg{width:1.05rem;height:1.05rem;fill:currentColor}
.note{position:fixed;left:50%;transform:translateX(-50%);z-index:60;
      bottom:calc(5.4rem + env(safe-area-inset-bottom,0px));
      background:var(--accent);color:#fff;font-size:.82rem;font-weight:600;
      padding:.6rem .9rem;border-radius:999px;max-width:calc(100vw - 2rem);
      box-shadow:0 4px 18px rgba(0,0,0,.6);transition:opacity .5s}
.note.go{opacity:0}
h2.ch{font-size:1.25rem;line-height:1.3;margin:.2rem 0 .35rem;text-wrap:balance}
.sub{color:var(--dim);font-size:.85rem;margin:.45rem 0 0}
.ten{color:var(--dim);font-size:.9rem;font-style:italic;font-family:var(--serif);margin:.3rem 0 0;line-height:1.35}

.acts{display:flex;align-items:center;gap:.25rem;margin:.5rem 0 -.15rem;max-width:22rem}
.act{display:inline-flex;align-items:center;gap:.3rem;color:var(--dim);font-size:.78rem;
     padding:.35rem .45rem;border-radius:999px;line-height:1;font-variant-numeric:tabular-nums}
.act svg{width:1.05rem;height:1.05rem;fill:currentColor}
.act:hover{color:var(--accent);background:rgba(29,155,240,.1)}
.act.mark:hover{color:var(--saved);background:rgba(249,24,128,.1)}
.act.on{color:var(--accent)}
.act.mark.on{color:var(--saved)}
.act.wide{margin-left:auto;padding-right:0}
.act.wide:hover{background:none}

/* ---------- stop card, intro, lists ---------- */
.stop{text-align:center;padding-block:2.4rem;border-bottom:1px solid var(--line)}
.stop b{display:block;font-size:1rem;margin-bottom:.3rem}
.stop span{color:var(--dim);font-size:.85rem}
.intro .body p{margin:0 0 .7rem}
.pill{display:inline-block;background:var(--fg);color:#000;font-weight:700;font-size:.9rem;
      padding:.5rem 1rem;border-radius:999px;margin-top:.3rem}
.drop{border:1px dashed var(--line);border-radius:1rem;padding:1.1rem;text-align:center;
      color:var(--dim);font-size:.86rem;margin-top:.6rem}
.drop.on{border-color:var(--accent);background:rgba(29,155,240,.08);color:var(--fg)}
.row{display:flex;gap:.8rem;align-items:flex-start;
     padding-left:max(16px,env(safe-area-inset-left,0px));
     padding-right:max(16px,env(safe-area-inset-right,0px));
     padding-block:.85rem;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:hover{background:var(--hover)}
.row .n{width:2.6rem;flex:none;color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;padding-top:.15rem}
.row .t{min-width:0;flex:1}
.row .t b{display:block;font-size:.95rem;font-weight:600;line-height:1.3}
.row .t span{display:block;color:var(--dim);font-size:.8rem;margin-top:.15rem}
.row .t .snip{color:var(--fg);font-size:.92rem;line-height:1.4;margin-top:.2rem}
.badge{font-size:.72rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;
       padding:.1rem .45rem;align-self:flex-start;margin-top:.15rem}
.empty{color:var(--dim);font-size:.9rem;padding-block:3rem;text-align:center}

.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));
     bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));z-index:25;
     width:3.4rem;height:3.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink);
     display:grid;place-items:center;box-shadow:0 2px 14px rgba(0,0,0,.6)}
.fab svg{width:1.5rem;height:1.5rem;fill:currentColor}
.earlier{display:block;width:100%;color:var(--accent);font-size:.9rem;padding-block:.9rem;
     border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="ava" id="ava">L</div>
      <div class="who"><b id="bk">Lesefeed</b><span id="pos">sample</span></div>
      <button class="aa" id="aa" title="Text size">Aa</button>
    </div>
    <nav role="tablist">
      <button role="tab" aria-selected="true" data-v="reading">Reading</button>
      <button role="tab" aria-selected="false" data-v="sittings">Sittings</button>
      <button role="tab" aria-selected="false" data-v="saved">Saved</button>
    </nav>
  </div>
  <div class="rail"><i id="rail"></i></div>
</header>

<main>
  <div id="reading"></div>
  <div id="sittings" hidden></div>
  <div id="saved" hidden></div>
</main>

<input type="file" id="file" accept=".epub,application/epub+zip" hidden>
<button class="fab" id="fab" title="Open an EPUB">
  <svg viewBox="0 0 24 24"><path d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/></svg>
</button>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var feed=$("#reading"), rail=$("#rail"), posEl=$("#pos"), bkEl=$("#bk"), avaEl=$("#ava");

var ICON={
 tick:'<svg class="tick" viewBox="0 0 24 24"><path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81C14.67 2.63 13.43 1.75 12 1.75s-2.67.88-3.34 2.19c-1.39-.46-2.9-.2-3.91.81s-1.27 2.52-.81 3.91C2.63 9.33 1.75 10.57 1.75 12s.88 2.67 2.19 3.34c-.46 1.39-.2 2.9.81 3.91s2.52 1.27 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.67-.88 3.34-2.19c1.39.46 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>',
 en:'<svg viewBox="0 0 24 24"><path d="M1.75 12c0-5.66 4.59-10.25 10.25-10.25S22.25 6.34 22.25 12 17.66 22.25 12 22.25c-1.53 0-2.98-.34-4.29-.94l-4.37 1.2 1.2-4.37C3.84 16.6 1.75 14.46 1.75 12zm10.25-8.25c-4.55 0-8.25 3.7-8.25 8.25 0 1.9.64 3.65 1.73 5.04l-.63 2.3 2.3-.63c1.39 1.09 3.14 1.73 5.04 1.73 4.55 0 8.25-3.7 8.25-8.25S16.55 3.75 12 3.75zM7.5 11h9v2h-9zm0-3.5h9v2h-9zm0 7h5.5v2H7.5z"/></svg>',

 markOn:'<svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 016.5 2h11A2.5 2.5 0 0120 4.5v17.1l-8-4.57-8 4.57z"/></svg>',

/* ---------- storage: the book, your place, your bookmarks ---------- */
function db(){return new Promise(function(res,rej){
  var r=indexedDB.open("lesefeed",1);
  r.onupgradeneeded=function(){r.result.createObjectStore("kv")};
  r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)};
})}
function kvGet(k){return db().then(function(d){return new Promise(function(res){
  var t=d.transaction("kv","readonly"), q=t.objectStore("kv").get(k);
  q.onsuccess=function(){res(q.result)}; q.onerror=function(){res(undefined)};
})}).catch(function(){return undefined})}
function kvSet(k,v){return db().then(function(d){return new Promise(function(res){
  var t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k);
  t.oncomplete=function(){res()}; t.onerror=function(){res()};
})}).catch(function(){})}
function pref(k,v){try{ if(v===undefined) return localStorage.getItem(k);
  localStorage.setItem(k,v); return v }catch(e){ return null }}

/* ---------- EPUB -> posts ---------- */
function textOf(n){return (n&&n.textContent||"").replace(/\s+/g," ").trim()}
function stripNum(t){return String(t).replace(/^\s*\d+\.\s*/,"")}
function sitNo(t){var m=/^\s*(\d+)\./.exec(t||"");return m?+m[1]:null}

function parseDoc(doc,cards){
  var h1=doc.querySelector("h1"), banner=doc.querySelector(".banner");
  if(h1) cards.push({t:"head",title:textOf(h1),meta:textOf(banner)});
  var units=doc.querySelectorAll("div.u");
  if(units.length){
    var stream=doc.querySelectorAll("div.u, h2, p.endmark, ol.how li, p.howp, p.en.s");
    Array.prototype.forEach.call(stream,function(el){
      if(!el.classList.contains("u") && el.closest && el.closest("div.u")) return;
      if(el.tagName==="H2"){cards.push({t:"sub",title:textOf(el)});return}
      if(el.classList.contains("endmark")){cards.push({t:"stop",title:textOf(el)});return}
      if(el.tagName==="LI"||el.classList.contains("howp")||el.tagName==="P"){
        cards.push({t:"plain",lines:[textOf(el)]});return}
      var de=el.querySelector("p.de"), en=el.querySelector("p.en"),
          il=el.querySelector("p.il"), gl=el.querySelectorAll("ul.gl li");
      if(!de) return;
      var lines=de.innerHTML.split(/<br\s*\/?>/i).map(function(x){
        return x.replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<")
                .replace(/&gt;/g,">").replace(/&#183;/g,"·").replace(/&#160;|&nbsp;/g," ").trim();
      }).filter(Boolean);
      if(el.classList.contains("closer")){
        cards.push({t:"closer",en:en?textOf(en):"",lines:lines}); return;
      }
      cards.push({t:"unit",lines:lines,en:en?textOf(en):"",il:il?textOf(il):"",
        gl:Array.prototype.map.call(gl,function(li){
          var b=li.querySelector("b"), w=textOf(b);
          return {w:w,g:textOf(li).replace(w,"").trim()};
        })});
    });
    return;
  }
  Array.prototype.forEach.call(doc.querySelectorAll("p, blockquote"),function(p){
    var t=textOf(p); if(t.length<2) return;
    if(t.split(/\s+/).length<=55){cards.push({t:"plain",lines:[t]});return}
    var sents=t.match(/[^.!?]+[.!?]*(\s|$)/g)||[t], buf="";
    sents.forEach(function(s){ buf+=s;
      if(buf.split(/\s+/).length>=38){cards.push({t:"plain",lines:[buf.trim()]});buf=""}});
    if(buf.trim()) cards.push({t:"plain",lines:[buf.trim()]});
  });
}

function parseEpub(buf){
  return JSZip.loadAsync(buf).then(function(zip){
    var P=new DOMParser();
    return zip.file("META-INF/container.xml").async("string").then(function(c){
      var rf=P.parseFromString(c,"application/xml").getElementsByTagName("rootfile")[0];
      var opfPath=rf.getAttribute("full-path");
      var base=opfPath.indexOf("/")>-1?opfPath.slice(0,opfPath.lastIndexOf("/")+1):"";
      return zip.file(opfPath).async("string").then(function(o){
        var opf=P.parseFromString(o,"application/xml");
        var tEl=opf.getElementsByTagName("dc:title")[0]||opf.getElementsByTagName("title")[0];
        var aEl=opf.getElementsByTagName("dc:creator")[0];
        var items={};
        Array.prototype.forEach.call(opf.getElementsByTagName("item"),function(it){
          items[it.getAttribute("id")]={href:it.getAttribute("href"),type:it.getAttribute("media-type")||""}});
        var order=Array.prototype.map.call(opf.getElementsByTagName("itemref"),function(r){
          return items[r.getAttribute("idref")]}).filter(function(x){return x&&/html/.test(x.type)});
        var cards=[];
        return order.reduce(function(chain,it){
          return chain.then(function(){
            var f=zip.file(base+decodeURIComponent(it.href)); if(!f) return;
            return f.async("string").then(function(html){
              var d;
              try{ d=P.parseFromString(html,"application/xhtml+xml");
                   if(d.getElementsByTagName("parsererror").length) throw 0 }
              catch(e){ d=P.parseFromString(html,"text/html") }
              parseDoc(d,cards);
            });
          });
        },Promise.resolve()).then(function(){
          return {title:textOf(tEl)||"Untitled", author:textOf(aEl)||"", cards:cards};
        });
      });
    });
  });
}

/* ---------- state ---------- */
var BOOK=null, at=0, head=0, CHUNK=25, marks={}, tab="reading";
var SIZES=["0.95rem","1.0625rem","1.2rem"], si=+(pref("sz")||1);
document.documentElement.style.setProperty("--sz",SIZES[si]);

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;"})}

/* Every German word is tappable. The dictionary is 59,000 entries shipped
   with the app, so a lookup costs nothing and works with no signal. */
var DICT=null, FORMS=null;
function words(line){
  return esc(line).replace(/[A-Za-zÄÖÜäöüßéèêà]{2,}/g, function(w){
    return '<span class="w">'+w+"</span>" });
}
function deumlaut(s){return s.replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")}
function lookupWord(raw){
  if(!DICT) return null;
  var w=raw.toLowerCase().replace(/[^a-zäöüß]/g,"");
  if(!w) return null;
  var tries=[w, deumlaut(w)];
  /* the book's own inflected forms, mapped to headwords when it was built */
  if(FORMS && FORMS[w]) tries.push(FORMS[w]);
  /* inflection, cheaply: German hangs its endings on the back */
  ["e","en","em","er","es","n","s","nen","ern"].forEach(function(suf){
    if(w.length>suf.length+2 && w.slice(-suf.length)===suf){
      var stem=w.slice(0,-suf.length);
      tries.push(stem, stem+"e", stem+"en", deumlaut(stem), deumlaut(stem)+"en");
    }
  });
  if(/^ge.{3,}/.test(w)){ var p=w.slice(2); tries.push(p, p.replace(/t$/,"en"), p+"en") }
  if(/^(ab|an|auf|aus|bei|ein|her|hin|mit|nach|vor|zu|über|unter|um|durch)/.test(w)){
    tries.push(w.replace(/^(ab|an|auf|aus|bei|ein|her|hin|mit|nach|vor|zu|über|unter|um|durch)/,""));
  }
  /* an unfamiliar compound is usually two words you know */
  for(var i=0;i<tries.length;i++){ var hit=DICT[tries[i]]; if(hit) return hit }
  for(var cut=w.length-3; cut>=4; cut--){
    var head=w.slice(0,cut), tail=w.slice(cut);
    /* German glues compounds with a linking letter: Heer-es-weg */
    var heads=[head, head+"e", head.replace(/(es|en|er|s|n|e)$/,"")];
    var tails=[tail, tail.replace(/^(es|en|er|s|n)/,"")];
    for(var x=0;x<heads.length;x++) for(var y=0;y<tails.length;y++){
      var a=DICT[heads[x]], bb=DICT[tails[y]];
      if(a&&bb&&heads[x].length>=3&&tails[y].length>=3)
        return a.split(",")[0]+" + "+bb.split(",")[0];
    }
  }
  return null;
}
var pop=null;

function handle(){ if(!BOOK) return "@book";
  var a=(BOOK.author||BOOK.title||"book").toLowerCase().replace(/[^a-zäöü]+/g,"");
  return "@"+(a.slice(0,16)||"book") }
function initial(){ return (BOOK&&BOOK.title||"L").trim().charAt(0).toUpperCase() }
function sittingOf(i){ for(var j=i;j>=0;j--){ var c=BOOK.cards[j];
  if(c.t==="head") return {n:sitNo(c.title), title:stripNum(c.title), meta:c.meta||"", i:j} } return null }

/* A streak is the only metric that matters for a book this long: 210 sittings
   is finished by turning up, not by reading hard. */
function today(){ return new Date().toISOString().slice(0,10) }
function streak(){ try{ return JSON.parse(pref("streak")||'{"last":"","n":0}') }
  catch(e){ return {last:"",n:0} } }
function finishDay(){
  var s=streak(), t=today();
  if(s.last===t) return s;
  var y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  s.n = (s.last===y ? (s.n||0)+1 : 1); s.last=t;
  pref("streak",JSON.stringify(s)); return s;

/* ---------- rendering ---------- */
function postShell(i,opts){
  var d=document.createElement("article");

function metaLine(ago){
  return '<div class="meta"><b>'+esc(BOOK.title.slice(0,34))+"</b>"+ICON.tick+
    '<span class="at">'+esc(handle())+'</span><span class="dot">·</span>'+
    '<span class="ago">'+esc(ago)+"</span></div>";
}
function sitPos(i){
  var s=sittingOf(i); if(!s) return "";
  var end=BOOK.cards.length;
  for(var j=s.i+1;j<BOOK.cards.length;j++){ if(BOOK.cards[j].t==="head"){ end=j; break } }
  return (i-s.i)+"/"+(end-s.i-1);
}
function actRow(i,c){
  var h='<div class="acts">';
  if(c.en) h+='<button class="act en-t" data-a="en" title="Show the English">'+ICON.en+"<span>English</span></button>";
  if(c.il) h+='<button class="act" data-a="il" title="Word for word">'+ICON.il+"</button>";
  h+='<button class="act" data-a="say" title="Hear the German">'+ICON.say+"</button>";
  h+='<button class="act mark'+(marks[i]?" on":"")+'" data-a="mark" title="Save this sentence">'+
       (marks[i]?ICON.markOn:ICON.mark)+"</button>";

  return h+"</div>";
}
function cardEl(i){
  var c=BOOK.cards[i], prev=BOOK.cards[i-1];
  var cont = prev && prev.t!=="head" && prev.t!=="stop" && c.t!=="head" && c.t!=="stop";
  var next=BOOK.cards[i+1];
  var last = !next || next.t==="head" || next.t==="stop";

  if(c.t==="stop"){
    var s=document.createElement("div"); s.className="post stop"; s.dataset.i=i;
    s.style.display="block";
    var st=streak(), doneToday=st.last===today();
    s.innerHTML="<b>"+esc(c.title)+"</b><span>Close it here. Tomorrow starts where you stopped.</span>"+
      '<div style="margin-top:1rem"><button class="pill" data-done="1">'+
      (doneToday?"Done today · day "+st.n:"Mark today done")+"</button></div>";
    s.addEventListener("click",function(e){
      if(!e.target.closest("[data-done]")) return;
      var r=finishDay();
      e.target.textContent="Done today · day "+r.n;
    });
    return s;
  }
  var d=postShell(i,{cont:cont,last:last});
  var b=$(".body",d);
  if(c.t==="head"){
    var n=sitNo(c.title);
    b.innerHTML=metaLine(n?"Sitting "+n:"Section")+
      '<h2 class="ch">'+esc(stripNum(c.title))+"</h2>"+
      (c.en?'<p class="ten">'+esc(c.en)+"</p>":"")+
      (c.meta?'<p class="sub">'+esc(c.meta)+"</p>":"");
    return d;
  }
  if(c.t==="sub"){
    b.innerHTML='<h2 class="ch">'+esc(c.title)+"</h2>"+
      (c.en?'<p class="ten">'+esc(c.en)+"</p>":""); return d;
  }
  if(c.t==="warmhead"){
    d.className="post warmhead"; d.style.display="block";
    d.innerHTML='<span class="eyebrow warm">'+esc(c.title)+"</span>";
    return d;
  }
  if(c.t==="warm"){
    /* plain German written for this reader, with the English kept visible --
       this tier is a run-up, not a test */
    b.innerHTML=(cont?"":metaLine("Vorlauf"))+
      '<p class="de warm">'+c.lines.map(words).join(" ")+"</p>"+
      '<p class="en open">'+esc(c.en)+"</p>"+
      '<div class="acts"><button class="act" data-a="say">'+ICON.say+"</button>"+
      '<button class="act mark'+(marks[i]?" on":"")+'" data-a="mark">'+(marks[i]?ICON.markOn:ICON.mark)+"</button></div>";
    return d;
  }
  if(c.t==="closer"){
    /* the English for the sentence you have just worked through, then that
       sentence again -- the last step of the loop, without scrolling back */
    b.innerHTML='<p class="en open">'+esc(c.en)+"</p>"+
      '<p class="cap">now read it again</p>'+
      '<p class="de echo">'+c.lines.map(words).join(" ")+"</p>"+
      '<div class="acts"><button class="act" data-a="say" title="Hear it">'+ICON.say+"</button>"+
      '<button class="act mark'+(marks[i]?" on":"")+'" data-a="mark">'+(marks[i]?ICON.markOn:ICON.mark)+"</button></div>";
    return d;
  }
  var txt='<p class="de">'+c.lines.map(function(l,k){
     return (k?'<span class="br">':"<span>")+words(l)+"</span>"}).join("")+"</p>";
  /* the word-for-word crib stays out of sight: with it under the line you
     read that instead of the German. It is there if a clause defeats you. */
  if(c.il) txt+='<p class="il" hidden>'+esc(c.il)+"</p>";
  var gl=(c.gl&&c.gl.length)?'<ul class="gl">'+c.gl.map(function(g){
     return "<li><b>"+esc(g.w)+"</b> "+esc(g.g)+"</li>"}).join("")+"</ul>":"";
  var en=c.en?'<p class="en" hidden>'+esc(c.en)+"</p>":"";
  b.innerHTML=(cont?"":metaLine(sitLabel(i)))+txt+gl+en+(c.t==="plain"?"":actRow(i,c));
  return d;
}
function sitLabel(i){ var s=sittingOf(i); return s&&s.n?("Sitting "+s.n):"now" }

function paint(from,to,prepend){
  var frag=document.createDocumentFragment();
  for(var i=from;i<to;i++) frag.appendChild(cardEl(i));
  if(prepend){ var y=document.body.scrollHeight;
    feed.insertBefore(frag,feed.firstChild);
    window.scrollBy(0,document.body.scrollHeight-y);
  } else feed.appendChild(frag);

    b.className="earlier"; b.id="earlierBtn"; b.textContent="Show earlier";
    b.addEventListener("click",function(){
      var f=Math.max(0,head-CHUNK); if(f===head) return; var t=head; head=f; paint(f,t,true);

function render(start){

function show(book,start){

/* Reading aloud keeps you honest about where the clauses end, and the phone
   already has a German voice. Silent failure is fine: not every device has one. */
function speak(text,btn){
  try{
    if(!window.speechSynthesis) return;
    if(speechSynthesis.speaking){ speechSynthesis.cancel(); if(btn) btn.classList.remove("on"); return }
    var u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE"; u.rate=.85;
    var v=(speechSynthesis.getVoices()||[]).filter(function(x){return /^de/i.test(x.lang)})[0];
    if(v) u.voice=v;
    if(btn){ btn.classList.add("on"); u.onend=u.onerror=function(){btn.classList.remove("on")} }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* A link ending #s42 opens at sitting 42. If this browser ever loses its
   storage, that is how you get back without hunting. */
function hashStart(book){
  var m=/^#s(\d+)$/.exec(location.hash||""); if(!m) return null;
  var want=+m[1], found=null;
  book.cards.forEach(function(c,i){ if(found===null&&c.t==="head"&&sitNo(c.title)===want) found=i });
  return found;
}
/* the tap dictionary loads in the background; the page is readable without it */
fetch("dict.json").then(function(r){ return r.ok?r.json():null })
  .then(function(d){ DICT=d }).catch(function(){});
fetch("forms.json").then(function(r){ return r.ok?r.json():null })
  .then(function(f){ FORMS=f }).catch(function(){});

function sittingNumberAt(book,i){
  for(var j=i;j>=0;j--){ if(book.cards[j].t==="head") return sitNo(book.cards[j].title) }
  return null;
}
function headOfSitting(book,n){
  for(var j=0;j<book.cards.length;j++){
    if(book.cards[j].t==="head" && sitNo(book.cards[j].title)===n) return j }
  return 0;
}
/* A rebuild renumbers the sittings, so a saved sitting number means nothing.
   What does survive is how far into the book you had read, counted in German
   words. Find that point in the new build and start at the sitting holding it. */
function wordsUpTo(book,i){
  var n=0;
  for(var j=0;j<i&&j<book.cards.length;j++){
    var c=book.cards[j];
    if(c.t==="unit"||c.t==="plain"){
      var ls=c.lines||[];
      for(var k=0;k<ls.length;k++) n+=ls[k].split(/\s+/).length;
    }
  }
  return n;
}
function adopt(fresh,saved,pos){
  if(!saved || saved.v===fresh.v) return null;
  var target=wordsUpTo(saved,pos||0);
  if(!target) return 0;
  var n=0, hit=fresh.cards.length-1;
  for(var j=0;j<fresh.cards.length;j++){
    var c=fresh.cards[j];
    if(c.t==="unit"||c.t==="plain"){
      var ls=c.lines||[];
      for(var k=0;k<ls.length;k++) n+=ls[k].split(/\s+/).length;
    }
    if(n>=target){ hit=j; break }
  }
  /* start at the top of whatever sitting that lands in */
  for(var b=hit;b>=0;b--) if(fresh.cards[b].t==="head") return b;
  return 0;
}
kvGet("book").then(function(saved){
  if(saved&&saved.cards&&saved.cards.length){
    return kvGet("pos:"+saved.id).then(function(pos){
      return fetch("book.json").then(function(r){ return r.ok?r.json():null }).then(function(fresh){
        if(fresh && fresh.v && saved.v!==fresh.v){
          var start=adopt(fresh,saved,pos);
          kvSet("book",fresh); kvSet("pos:"+fresh.id,start||0);
          show(fresh,start||0);
          note("Updated \u00b7 picking up at sitting "+
               (sittingNumberAt(fresh,start||0)||1)+", where you had read to.");
          return;
        }
        var h=hashStart(saved);
        show(saved, h!==null?h:(pos||0));
      }).catch(function(){
        var h=hashStart(saved); show(saved, h!==null?h:(pos||0));
      });
    });
  }
  return fetch("book.json").then(function(r){ return r.json() }).then(function(b){
    kvSet("book",b);
    return kvGet("pos:"+b.id).then(function(p){
      var h=hashStart(b); show(b, h!==null?h:(p||0));
    });
  });
}).catch(function(){
  BOOK=SAMPLE; bkEl.textContent=SAMPLE.title; avaEl.textContent="K"; render(0);
  posEl.textContent="sample";
});
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
